# Builds the static site on every push to main and publishes the built
# files (frontend/dist) to the `deploy` branch. Point Enhance's Git deploy
# at the `deploy` branch so the server only receives ready-to-serve files
# and never has to run npm.
name: Build and publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Optional: set this as a repository variable to override the
          # webhook URL baked into the build. The app falls back to the
          # production URL when it is empty.
          VITE_N8N_WEBHOOK_URL: ${{ vars.VITE_N8N_WEBHOOK_URL }}

      - name: Publish dist to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: frontend/dist
          force_orphan: true
          commit_message: "Build from ${{ github.sha }}"
